name: Crawl Oasis Wiki and update knowledge base

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/crawl-and-index.yml"
      - "scripts/**"
      - "requirements.txt"
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: oasis-wiki-crawl
  cancel-in-progress: false

jobs:
  crawl-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Crawl JavaScript Wiki and convert to Markdown
        run: python -u scripts/crawl_wiki.py --output-dir knowledge --force --prune-output

      - name: Crawl API reference and convert to Markdown
        run: >-
          python -u scripts/crawl_api_wiki.py
          --output-dir knowledge/api --workers 12 --force --prune-output

      - name: Refresh skill API catalog
        run: cp knowledge/api/catalog.json skills/oasis-wiki-knowledge/references/api-catalog.json

      - name: Synchronize OpenAI Vector Store
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/vector_store.py
          --state knowledge/vector_store.json
          sync
          --directory knowledge/articles
          --directory knowledge/api/chunks
          --prune

      - name: Commit refreshed Markdown and Vector Store state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge skills/oasis-wiki-knowledge/references/api-catalog.json
          if git diff --cached --quiet; then
            echo "No knowledge changes"
          else
            git commit -m "docs: refresh Oasis Wiki knowledge base"
            git push
          fi

      - name: Upload Markdown artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oasis-wiki-markdown
          path: knowledge/
          if-no-files-found: error
          retention-days: 30

